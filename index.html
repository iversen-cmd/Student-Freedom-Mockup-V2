<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Freedom — Investor Prototype v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1A2F; --navy2:#122642; --teal:#0FB8A4; --blue:#1A6DFF;
  --orange:#FF8A3D; --white:#fff; --grey:#F5F7FA; --line:#E7ECF2;
  --dim:#6B7A90; --red:#E45858; --gold:#F5B23D;
}
*{box-sizing:border-box;}
body{
  margin:0;font-family:'Inter',sans-serif;
  background:
    radial-gradient(circle at 12% 8%, #10233d 0%, transparent 45%),
    radial-gradient(circle at 88% 92%, #0b1e35 0%, transparent 50%),
    var(--navy);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:36px 16px 60px;
}
.stage-header{text-align:center;color:#fff;margin-bottom:26px;max-width:560px;}
.stage-header .eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(15,184,164,.12);border:1px solid rgba(15,184,164,.35);
  color:var(--teal);font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:6px 14px;border-radius:100px;margin-bottom:14px;
}
.stage-header h1{font-size:28px;font-weight:900;margin:0 0 8px;letter-spacing:-.02em;}
.stage-header p{color:#9FB0C6;font-size:14px;line-height:1.6;margin:0;}
.layout{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap;justify-content:center;}

/* PHONE */
.phone{
  width:375px;height:812px;background:#000;border-radius:52px;padding:14px;
  box-shadow:0 40px 90px -20px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.06);
  position:relative;flex-shrink:0;
}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);
  width:120px;height:26px;background:#000;border-radius:0 0 18px 18px;z-index:40;}
.screen{width:100%;height:100%;background:var(--grey);border-radius:38px;overflow:hidden;
  position:relative;display:flex;flex-direction:column;}
.statusbar{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:13px;font-weight:600;z-index:15;position:relative;}
.statusbar.dark{color:#fff;} .statusbar.light{color:var(--navy);}
.sbody{flex:1;overflow-y:auto;scrollbar-width:none;position:relative;}
.sbody::-webkit-scrollbar{display:none;}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:134px;height:5px;background:rgba(0,0,0,.25);border-radius:10px;z-index:40;}
.homebar.lt{background:rgba(255,255,255,.5);}

/* NAV */
.bnav{flex-shrink:0;display:flex;background:#fff;border-top:1px solid var(--line);
  padding:8px 4px 20px;position:relative;}
.nitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:700;color:#A6B2C3;cursor:pointer;background:none;border:none;
  font-family:inherit;padding:4px 0;}
.nitem.active{color:var(--teal);}
.nitem svg{width:22px;height:22px;}
.nitem.fab-slot{position:relative;}
.fab{
  position:absolute;top:-26px;left:50%;transform:translateX(-50%);
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--teal));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 22px -6px rgba(15,184,164,.55);
  border:4px solid var(--grey);cursor:pointer;
}
.fab svg{width:24px;height:24px;}
.fab-label{margin-top:26px;font-size:10px;font-weight:700;color:#A6B2C3;}
.nitem.fab-slot.active .fab-label{color:var(--teal);}

/* SIDE PANEL */
.sidepanel{width:320px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
  border-radius:20px;padding:22px;color:#D7E0EB;position:sticky;top:36px;}
.sidepanel h3{color:#fff;font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.rolebar{display:flex;background:rgba(255,255,255,.06);border-radius:12px;padding:4px;margin-bottom:18px;}
.rolebtn{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:12.5px;font-weight:800;
  color:#8FA2BA;cursor:pointer;transition:all .15s;}
.rolebtn.on{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;}
.step{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;cursor:pointer;
  font-size:12.5px;font-weight:600;color:#9FB0C6;margin-bottom:3px;transition:background .15s;}
.step:hover{background:rgba(255,255,255,.05);}
.step.active{background:linear-gradient(90deg,rgba(26,109,255,.18),rgba(15,184,164,.18));color:#fff;}
.step .num{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;}
.step.active .num{background:var(--teal);color:var(--navy);}
.note{margin-top:16px;font-size:11.5px;line-height:1.65;color:#7C8CA3;
  border-top:1px solid rgba(255,255,255,.08);padding-top:13px;}
.note b{color:#B9C6D8;}
.newtag{font-size:8.5px;font-weight:900;background:var(--orange);color:#fff;
  padding:2px 6px;border-radius:100px;margin-left:auto;letter-spacing:.04em;}

/* SPLASH */
.splash{position:absolute;inset:14px;border-radius:38px;background:#fff;z-index:35;
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s ease;}
.splash.hide{opacity:0;pointer-events:none;}
.splash .slogo{width:72%;animation:splashIn .85s cubic-bezier(.2,.9,.3,1.15);}
.splash-bar{width:110px;height:4px;border-radius:10px;background:var(--line);margin-top:36px;overflow:hidden;}
.splash-bar i{display:block;height:100%;width:0;border-radius:10px;
  background:linear-gradient(90deg,var(--blue),var(--teal));animation:sbar 2.35s ease forwards;}
@keyframes sbar{to{width:100%;}}
@keyframes splashIn{from{opacity:0;transform:scale(.82);}to{opacity:1;transform:scale(1);}}
.replaybtn{width:100%;margin:-6px 0 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  color:#B9C6D8;border-radius:10px;padding:8px;font-size:11.5px;font-weight:800;font-family:inherit;cursor:pointer;}
.replaybtn:hover{background:rgba(255,255,255,.1);color:#fff;}

/* GENERIC */
.pad{padding:22px 20px;}
.fade{animation:fi .3s ease;}
@keyframes fi{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.card{background:#fff;border-radius:18px;padding:16px 18px;margin-bottom:12px;
  box-shadow:0 6px 18px -8px rgba(10,26,47,.12);}
.seclabel{font-size:13px;font-weight:800;color:var(--navy);margin:20px 0 10px;padding:0 2px;
  display:flex;justify-content:space-between;align-items:center;}
.seclabel a{font-size:11.5px;color:var(--teal);font-weight:700;text-decoration:none;cursor:pointer;}
.pill{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:100px;}
.pill.pos{background:rgba(15,184,164,.12);color:var(--teal);}
.pill.warn{background:rgba(255,138,61,.13);color:var(--orange);}
.pill.blue{background:rgba(26,109,255,.1);color:var(--blue);}
.btn{width:100%;border:none;padding:14px;border-radius:13px;font-weight:800;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:transform .1s;}
.btn:active{transform:scale(.98);}
.btn.teal{background:var(--teal);color:#fff;}
.btn.navy{background:var(--navy);color:#fff;}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
.btn.white{background:#fff;color:var(--navy);box-shadow:0 10px 24px -8px rgba(0,0,0,.35);}

/* TOAST + CONFETTI */
.toast{position:absolute;bottom:104px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--navy);color:#fff;padding:11px 20px;border-radius:100px;font-size:12.5px;
  font-weight:700;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);opacity:0;pointer-events:none;
  transition:all .25s ease;z-index:60;white-space:nowrap;display:flex;align-items:center;gap:8px;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px;z-index:70;pointer-events:none;
  animation:cf 1.4s ease-out forwards;}
@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1;}100%{transform:translateY(360px) rotate(540deg);opacity:0;}}

/* ONBOARDING */
.ob-grad{min-height:100%;background:linear-gradient(160deg,var(--blue),var(--teal));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 30px;text-align:center;color:#fff;}
.ob-grad h1{font-size:26px;font-weight:900;margin:0 0 10px;line-height:1.25;}
.ob-grad p{font-size:14px;opacity:.92;margin:0 0 40px;font-weight:500;}
.dots{display:flex;gap:7px;margin-bottom:28px;}
.dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);}
.dots span.on{background:#fff;width:22px;border-radius:100px;}
.stat-strip{display:flex;gap:10px;margin:0 0 34px;}
.stat-chip{background:rgba(255,255,255,.14);backdrop-filter:blur(4px);
  border-radius:14px;padding:12px 14px;flex:1;}
.stat-chip .v{font-size:17px;font-weight:900;}
.stat-chip .l{font-size:9.5px;font-weight:700;opacity:.85;margin-top:2px;text-transform:uppercase;letter-spacing:.03em;}
.field-label{font-size:11.5px;font-weight:800;color:var(--navy);margin:0 0 6px;
  text-transform:uppercase;letter-spacing:.04em;}
.field{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:#fff;font-size:14px;font-family:inherit;margin-bottom:14px;outline:none;transition:border-color .15s;}
.field:focus{border-color:var(--teal);}
.trustrow{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.trustbadge{font-size:10px;font-weight:800;color:var(--dim);background:var(--grey);
  border:1px solid var(--line);padding:5px 10px;border-radius:100px;display:flex;align-items:center;gap:5px;}
.cardviz{
  height:150px;border-radius:20px;margin:6px 0 18px;padding:18px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--navy) 0%,#1d3a5f 60%,#0FB8A4 160%);color:#fff;
  box-shadow:0 16px 32px -12px rgba(10,26,47,.5);
}
.cardviz .chip{width:36px;height:26px;border-radius:6px;background:linear-gradient(135deg,#F5B23D,#e09a20);}
.cardviz .num{font-size:16px;letter-spacing:3px;font-weight:600;margin-top:26px;}
.cardviz .brand{position:absolute;right:18px;bottom:14px;font-weight:900;font-style:italic;font-size:15px;opacity:.9;}

/* DASHBOARD */
.dhead{background:linear-gradient(135deg,var(--navy) 0%,#16324F 100%);padding:18px 20px 58px;color:#fff;position:relative;}
.dhead .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.greet{font-size:17px;font-weight:800;}
.greet span{opacity:.6;font-weight:500;font-size:12px;display:block;margin-bottom:1px;}
.hicons{display:flex;gap:8px;}
.hbtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
.hbtn .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--orange);border:1.5px solid var(--navy);}
.wb-wrap{display:flex;align-items:center;gap:14px;}
.wb-num{font-size:32px;font-weight:900;line-height:1;}
.wb-lab{font-size:11.5px;color:var(--teal);font-weight:800;margin-top:3px;}
.wb-sub{font-size:11px;color:#9FB0C6;margin-top:1px;}
.streak-chip{margin-left:auto;background:rgba(255,138,61,.15);border:1px solid rgba(255,138,61,.35);
  border-radius:100px;padding:6px 12px;font-size:11.5px;font-weight:800;color:var(--orange);display:flex;gap:5px;align-items:center;}

.herocard{
  margin:-42px 18px 0;background:#fff;border-radius:22px;padding:18px 20px;
  box-shadow:0 14px 34px -12px rgba(10,26,47,.25);position:relative;z-index:5;
}
.herocard .lbl{font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;}
.herocard .amt{font-size:29px;font-weight:900;color:var(--navy);margin:4px 0 2px;}
.herocard .delta{font-size:12px;font-weight:800;color:var(--teal);}
.hero-stats{display:flex;margin-top:14px;border-top:1px solid var(--line);padding-top:12px;gap:6px;}
.hstat{flex:1;text-align:center;}
.hstat .v{font-size:14.5px;font-weight:900;color:var(--navy);}
.hstat .l{font-size:9px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
.hstat + .hstat{border-left:1px solid var(--line);}

.qa-row{display:flex;gap:10px;margin:16px 0 4px;overflow-x:auto;padding:2px;}
.qa{flex-shrink:0;background:#fff;border:1.5px solid var(--line);padding:9px 14px;border-radius:100px;
  font-size:12px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;}
.qa.on{background:var(--navy);color:#fff;border-color:var(--navy);}

.feed-item{display:flex;gap:12px;align-items:center;background:#fff;border-radius:15px;
  padding:12px 14px;margin-bottom:8px;box-shadow:0 3px 12px -7px rgba(10,26,47,.12);}
.feed-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;}
.feed-main{flex:1;min-width:0;}
.feed-t{font-size:12.5px;font-weight:800;color:var(--navy);}
.feed-s{font-size:10.5px;color:var(--dim);font-weight:600;margin-top:1px;}
.feed-amt{font-size:12.5px;font-weight:900;text-align:right;}
.feed-amt small{display:block;font-size:9.5px;font-weight:700;color:var(--dim);}
.feed-item.new{animation:slideIn .4s ease;}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px);}to{opacity:1;transform:translateX(0);}}

/* GOAL RING CARD */
.goalcard{display:flex;align-items:center;gap:14px;}
.goalcard .info{flex:1;}
.goalcard .t{font-size:13px;font-weight:800;color:var(--navy);}
.goalcard .s{font-size:11px;color:var(--dim);font-weight:600;margin-top:2px;line-height:1.5;}

/* LOAN */
.loanhero{background:var(--navy);color:#fff;padding:20px 20px 24px;}
.loanhero .lbl{font-size:11.5px;color:#9FB0C6;font-weight:700;}
.loanhero .amt{font-size:30px;font-weight:900;margin-top:2px;}
.loanhero .amt span{font-size:14px;color:var(--teal);font-weight:800;margin-left:8px;}
.fbox{background:linear-gradient(135deg,rgba(26,109,255,.07),rgba(15,184,164,.09));
  border:1px solid rgba(15,184,164,.25);border-radius:18px;padding:17px;margin-top:4px;}
.fbox h4{font-size:13px;font-weight:900;color:var(--navy);margin:0 0 3px;}
.fbox p{font-size:11.5px;color:var(--dim);margin:0 0 13px;}
.srow{display:flex;align-items:center;gap:12px;}
input[type=range]{-webkit-appearance:none;flex:1;height:6px;border-radius:10px;background:var(--line);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--teal);box-shadow:0 3px 8px rgba(15,184,164,.5);cursor:pointer;border:3px solid #fff;}
.sval{font-size:13px;font-weight:900;color:var(--teal);min-width:56px;text-align:right;}
.fres{display:flex;gap:10px;margin-top:14px;}
.fstat{flex:1;background:#fff;border-radius:12px;padding:12px;text-align:center;}
.fstat .v{font-size:16.5px;font-weight:900;}
.fstat .l{font-size:9.5px;color:var(--dim);font-weight:700;margin-top:2px;}
.trow{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;
  padding:13px 15px;margin-bottom:9px;box-shadow:0 4px 12px -7px rgba(10,26,47,.12);}
.trow .tt{font-size:13px;font-weight:800;color:var(--navy);}
.trow .ts{font-size:10.5px;color:var(--dim);margin-top:2px;font-weight:600;}
.switch{width:44px;height:26px;border-radius:100px;background:var(--line);position:relative;
  cursor:pointer;flex-shrink:0;transition:background .2s;}
.switch.on{background:var(--teal);}
.switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s;}
.switch.on .knob{left:21px;}
.brow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.brow:last-child{border:none;}
.brow .bl{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--navy);}
.dot{width:10px;height:10px;border-radius:3px;}
.brow .ba{font-size:13px;font-weight:800;color:var(--navy);}

/* OFFERS / MARKETPLACE */
.offer-tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding:2px;}
.otab{flex-shrink:0;padding:8px 15px;border-radius:100px;font-size:12px;font-weight:800;cursor:pointer;
  background:#fff;color:var(--dim);border:1.5px solid var(--line);}
.otab.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.offer{display:flex;gap:13px;background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;
  box-shadow:0 4px 14px -8px rgba(10,26,47,.12);cursor:pointer;align-items:center;}
.offer .logo{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;
  justify-content:center;font-size:21px;flex-shrink:0;}
.offer .om{flex:1;min-width:0;}
.offer .ot{font-size:13px;font-weight:800;color:var(--navy);}
.offer .os{font-size:10.5px;color:var(--dim);font-weight:600;margin-top:2px;}
.offer .cb{font-size:13px;font-weight:900;color:var(--teal);text-align:right;flex-shrink:0;}
.offer .cb small{display:block;font-size:9px;font-weight:700;color:var(--dim);}
.qrmodal{position:absolute;inset:0;background:rgba(10,26,47,.65);z-index:80;
  display:flex;align-items:flex-end;animation:fi .2s ease;}
.qrsheet{background:#fff;border-radius:26px 26px 0 0;width:100%;padding:24px 22px 40px;text-align:center;
  animation:up .28s ease;}
@keyframes up{from{transform:translateY(60px);}to{transform:translateY(0);}}
.qrgrid{width:150px;height:150px;margin:16px auto;border-radius:14px;background:
  repeating-conic-gradient(var(--navy) 0% 25%, #fff 0% 50%) 0 0 / 20px 20px;border:8px solid #fff;
  outline:1.5px solid var(--line);}

/* PBSA */
.pbsa{background:#fff;border-radius:18px;overflow:hidden;margin-bottom:14px;
  box-shadow:0 6px 18px -8px rgba(10,26,47,.14);cursor:pointer;}
.pbsa .img{height:106px;position:relative;display:flex;align-items:flex-end;padding:12px;}
.pbsa .img .tag{background:rgba(255,255,255,.92);border-radius:100px;padding:5px 11px;
  font-size:10.5px;font-weight:900;color:var(--navy);display:flex;gap:5px;align-items:center;}
.pbsa .body{padding:13px 16px 15px;}
.pbsa .n{font-size:14px;font-weight:900;color:var(--navy);}
.pbsa .d{font-size:11px;color:var(--dim);font-weight:600;margin-top:2px;}
.pbsa .impact{margin-top:10px;background:rgba(15,184,164,.08);border:1px solid rgba(15,184,164,.25);
  border-radius:11px;padding:9px 12px;font-size:11.5px;font-weight:800;color:var(--teal);
  display:flex;align-items:center;gap:7px;}

/* COMMUNITY */
.levelcard{background:linear-gradient(135deg,var(--navy),#16324F);color:#fff;border-radius:20px;
  padding:19px;margin-bottom:14px;position:relative;overflow:hidden;}
.levelcard .lbl{font-size:10.5px;color:#9FB0C6;font-weight:800;text-transform:uppercase;letter-spacing:.05em;}
.levelcard h3{font-size:18px;font-weight:900;margin:4px 0 13px;}
.ptrack{height:8px;background:rgba(255,255,255,.12);border-radius:10px;overflow:hidden;margin-bottom:7px;}
.pfill{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:10px;transition:width .6s ease;}
.lfoot{display:flex;justify-content:space-between;font-size:10.5px;color:#9FB0C6;font-weight:700;}
.chal{background:#fff;border-radius:16px;padding:15px 16px;margin-bottom:10px;
  box-shadow:0 4px 14px -8px rgba(10,26,47,.12);}
.chal .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.chal .t{font-size:13px;font-weight:900;color:var(--navy);display:flex;gap:8px;align-items:center;}
.chal .meta{font-size:10.5px;color:var(--dim);font-weight:700;margin-bottom:9px;}
.chal .bar{height:7px;background:var(--line);border-radius:10px;overflow:hidden;}
.chal .barf{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:10px;transition:width .5s;}
.joinbtn{font-size:11px;font-weight:900;background:var(--teal);color:#fff;border:none;
  border-radius:100px;padding:7px 14px;font-family:inherit;cursor:pointer;}
.joinbtn.joined{background:rgba(15,184,164,.12);color:var(--teal);}
.lbtabs{display:flex;background:#fff;border-radius:12px;padding:4px;margin-bottom:10px;
  box-shadow:0 3px 10px -6px rgba(10,26,47,.1);}
.lbtab{flex:1;text-align:center;padding:8px 0;border-radius:9px;font-size:11.5px;font-weight:800;
  color:var(--dim);cursor:pointer;}
.lbtab.on{background:var(--navy);color:#fff;}
.lbrow{display:flex;align-items:center;gap:11px;background:#fff;border-radius:14px;padding:10px 13px;
  margin-bottom:7px;box-shadow:0 3px 10px -6px rgba(10,26,47,.1);}
.lbrank{width:22px;text-align:center;font-weight:900;font-size:13px;color:var(--dim);}
.lbrank.g{color:var(--gold);} 
.lbav{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:11.5px;flex-shrink:0;}
.lbn{flex:1;font-size:12.5px;font-weight:800;color:var(--navy);}
.lbn small{display:block;font-weight:600;color:var(--dim);font-size:10px;}
.lbs{font-size:13px;font-weight:900;color:var(--teal);}
.lbrow.me{border:1.5px solid var(--teal);}
.prize{background:linear-gradient(135deg,#2b1a4d,#0A1A2F);border-radius:18px;padding:17px;color:#fff;
  margin-bottom:14px;position:relative;overflow:hidden;}
.prize .t{font-size:14px;font-weight:900;}
.prize .s{font-size:11px;color:#B9AEDC;font-weight:600;margin-top:3px;line-height:1.5;}
.prize .cd{display:flex;gap:8px;margin-top:12px;}
.cdbox{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 0;flex:1;text-align:center;}
.cdbox .v{font-size:16px;font-weight:900;}
.cdbox .l{font-size:8.5px;font-weight:700;opacity:.7;text-transform:uppercase;margin-top:1px;}
.badgegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.badge{background:#fff;border-radius:14px;padding:10px 5px;text-align:center;
  box-shadow:0 3px 10px -6px rgba(10,26,47,.1);}
.badge .ic{font-size:20px;} .badge .n{font-size:8.5px;font-weight:800;color:var(--navy);margin-top:4px;line-height:1.25;}
.badge.locked{opacity:.35;}

/* AI CHAT */
.aihead{background:linear-gradient(135deg,var(--blue),var(--teal));padding:16px 20px 18px;color:#fff;
  display:flex;align-items:center;gap:12px;}
.aiorb{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 0 0 5px rgba(255,255,255,.1);animation:pulse 2.4s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 5px rgba(255,255,255,.1);}50%{box-shadow:0 0 0 9px rgba(255,255,255,.06);}}
.aihead .t{font-size:15.5px;font-weight:900;}
.aihead .s{font-size:11px;opacity:.9;font-weight:600;margin-top:1px;}
.chatarea{padding:16px 16px 8px;}
.msg{max-width:82%;padding:12px 15px;border-radius:18px;font-size:12.5px;line-height:1.55;
  margin-bottom:10px;font-weight:600;animation:fi .3s ease;}
.msg.ai{background:#fff;color:var(--navy);border-bottom-left-radius:5px;
  box-shadow:0 3px 12px -7px rgba(10,26,47,.15);}
.msg.me{background:var(--navy);color:#fff;margin-left:auto;border-bottom-right-radius:5px;}
.msg .hl{color:var(--teal);font-weight:900;}
.msg .act{margin-top:10px;display:inline-block;background:var(--teal);color:#fff;font-size:11px;
  font-weight:900;padding:8px 14px;border-radius:100px;cursor:pointer;}
.typing{display:flex;gap:4px;padding:14px 16px;background:#fff;border-radius:18px;width:60px;
  border-bottom-left-radius:5px;box-shadow:0 3px 12px -7px rgba(10,26,47,.15);margin-bottom:10px;}
.typing span{width:7px;height:7px;border-radius:50%;background:#B9C6D8;animation:tb 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
@keyframes tb{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}
.prompts{display:flex;flex-direction:column;gap:8px;padding:4px 16px 16px;}
.prompt{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 15px;
  font-size:12px;font-weight:800;color:var(--navy);cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;transition:border-color .15s;}
.prompt:hover{border-color:var(--teal);}
.prompt span{color:var(--teal);}

/* PARENT MODE */
.parenthero{background:linear-gradient(135deg,#3D2A78 0%,#1A6DFF 120%);padding:18px 20px 58px;color:#fff;position:relative;}
.impactnum{font-size:38px;font-weight:900;letter-spacing:-.02em;}
.familyrow{display:flex;gap:10px;margin-top:4px;}
.famchip{display:flex;align-items:center;gap:8px;background:#fff;border-radius:100px;
  padding:7px 13px 7px 7px;box-shadow:0 3px 10px -5px rgba(10,26,47,.15);font-size:11.5px;font-weight:800;color:var(--navy);}
.famav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#fff;font-weight:900;}

/* SETTINGS */
.profiletop{display:flex;align-items:center;gap:14px;padding:8px 2px 20px;}
.pav{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:19px;}
.pname{font-size:16px;font-weight:900;color:var(--navy);}
.psub{font-size:11.5px;color:var(--dim);margin-top:2px;font-weight:600;}
.sgroup{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:14px;
  box-shadow:0 4px 14px -8px rgba(10,26,47,.1);}
.srow2{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);
  font-size:13px;font-weight:700;color:var(--navy);cursor:pointer;}
.srow2:last-child{border:none;}
.srow2 .ic{width:30px;height:30px;border-radius:9px;background:var(--grey);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.srow2 .ch{margin-left:auto;color:#C2CCD9;font-weight:900;}

/* NOTIFICATION DRAWER */
.ndrawer{position:absolute;inset:0;background:rgba(10,26,47,.55);z-index:80;animation:fi .2s;}
.nsheet{position:absolute;top:0;right:0;bottom:0;width:86%;background:var(--grey);
  border-radius:26px 0 0 26px;padding:56px 18px 20px;overflow-y:auto;animation:slideL .25s ease;}
@keyframes slideL{from{transform:translateX(60px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.nitem2{display:flex;gap:11px;background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:9px;
  box-shadow:0 3px 10px -6px rgba(10,26,47,.1);align-items:flex-start;}
.nitem2 .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;}
.nitem2 .t{font-size:12px;font-weight:800;color:var(--navy);line-height:1.45;}
.nitem2 .s{font-size:10px;color:var(--dim);font-weight:600;margin-top:2px;}

@media (max-width:780px){
  .layout{flex-direction:column-reverse;align-items:center;}
  .sidepanel{width:100%;max-width:375px;position:relative;top:0;}
}
</style>
</head>

function toast(msg){
  let host = screenEl;
  let t = document.createElement('div');
  t.className='toast'; t.innerHTML=msg;
  host.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},1900);
}
function confetti(){
  const colors=['#0FB8A4','#1A6DFF','#FF8A3D','#F5B23D','#fff'];
  for(let i=0;i<26;i++){
    let c=document.createElement('div');
    c.className='confetti-piece';
    c.style.left=(20+Math.random()*60)+'%';
    c.style.top=(90+Math.random()*80)+'px';
    c.style.background=colors[i%colors.length];
    c.style.animationDelay=(Math.random()*0.25)+'s';
    c.style.width=c.style.height=(6+Math.random()*6)+'px';
    screenEl.appendChild(c);
    setTimeout(()=>c.remove(),1700);
  }
}
function countUp(el, from, to, prefix='£', dur=700){
  const start=performance.now();
  function f(now){
    const p=Math.min(1,(now-start)/dur);
    const e=1-Math.pow(1-p,3);
    el.textContent=prefix+Math.round(from+(to-from)*e).toLocaleString('en-GB');
    if(p<1) requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
}

      ${feedItem('⛽','#1A6DFF12','Shell fuel','Parent-only offer used','+£1.85','to her loan','var(--teal)')}
      ${feedItem('🛡️','#FF8A3D15','Aviva insurance renewal','Parent partner offer','+£18.50','to her loan','var(--orange)')}
      <div class="seclabel">Suggested for you</div>
      <div class="card">
        <div style="font-size:13px;font-weight:900;color:var(--navy);">🎯 Match Amara's round-ups</div>
        <div style="font-size:11.5px;color:var(--dim);font-weight:600;margin:4px 0 12px;line-height:1.55;">She rounds up ~£14/month. Matching it would shave another 2 months off her loan.</div>
        <button class="btn teal" style="padding:11px;" data-action="match">Match her round-ups</button>
      </div>
    </div>
  `, 'pdash');
}

function rPgoals(){
  return shell(false, `
    <div class="pad">
      <div style="font-size:19px;font-weight:900;color:var(--navy);">Shared goals</div>
      <div style="font-size:12px;color:var(--dim);font-weight:600;margin:4px 0 16px;">Goals you and Amara fund together.</div>
      <div class="card goalcard">
        <svg width="62" height="62" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="26" fill="none" stroke="var(--line)" stroke-width="8"/>
          <circle cx="32" cy="32" r="26" fill="none" stroke="var(--blue)" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="${2*Math.PI*26}" stroke-dashoffset="${2*Math.PI*26*(1-S.parentGoal/100)}" transform="rotate(-90 32 32)"/>
          <text x="32" y="37" text-anchor="middle" font-size="13" font-weight="900" fill="var(--navy)" font-family="Inter">${S.parentGoal}%</text>
        </svg>
        <div class="info">
          <div class="t">£100 off the loan in October</div>
          <div class="s">£${S.parentGoal} of £100 · You've added £42, Amara £${S.parentGoal-42}. On pace to finish 5 days early.</div>
        </div>
      </div>
      <button class="btn teal" data-action="addgoal">+ Add £20 to goal</button>
      <div class="seclabel">Goal history</div>
      ${feedItem('✅','#0FB8A415','September goal complete','£100 · finished 3 days early','−£100','off her loan','var(--teal)')}
      ${feedItem('✅','#0FB8A415','Freshers-month goal','£75 · joint effort','−£75','off her loan','var(--teal)')}
      <div class="card" style="background:rgba(61,42,120,.05);border:1px solid rgba(61,42,120,.18);box-shadow:none;">
        <div style="font-size:12px;font-weight:800;color:var(--navy);">🔒 Privacy by design</div>
        <div style="font-size:11px;color:var(--dim);font-weight:600;margin-top:4px;line-height:1.6;">You see goal progress and impact totals — never Amara's individual transactions. She controls what's shared.</div>
      </div>
    </div>
  `, 'pgoals');
}

function rPboard(){
  return shell(false, `
    <div class="pad">
      <div style="font-size:19px;font-weight:900;color:var(--navy);">Parent leaderboard</div>
      <div style="font-size:12px;color:var(--dim);font-weight:600;margin:4px 0 16px;">Who supported their child the most this month — University of Manchester parents.</div>
      <div class="lbrow me"><div class="lbrank g">1</div><div class="lbav" style="background:linear-gradient(135deg,#3D2A78,#1A6DFF);">HM</div><div class="lbn">Henrik M. (you)<small>Supporting Amara</small></div><div class="lbs">£47.20</div></div>
      <div class="lbrow"><div class="lbrank">2</div><div class="lbav">SP</div><div class="lbn">Sunita P.<small>Supporting Maya</small></div><div class="lbs">£41.10</div></div>
      <div class="lbrow"><div class="lbrank">3</div><div class="lbav">DK</div><div class="lbn">David K.<small>Supporting Jordan</small></div><div class="lbs">£38.65</div></div>
      <div class="lbrow"><div class="lbrank">4</div><div class="lbav">GT</div><div class="lbn">Grace T.<small>Supporting Sam</small></div><div class="lbs">£29.90</div></div>
      <div class="prize" style="margin-top:16px;">
        <div class="t">🏅 Top Supporter — October</div>
        <div class="s">Stay #1 through the month to earn the Family Champion badge and a bonus £10 injected into Amara's loan by Student Freedom.</div>
      </div>
    </div>
  `, 'pboard');
}

/* ---------- OVERLAYS ---------- */
function notifDrawer(){
  return `<div class="ndrawer" id="ndClose">
    <div class="nsheet">
      <div style="font-size:16px;font-weight:900;color:var(--navy);margin-bottom:14px;">Notifications</div>
      ${nItem('🎉','#0FB8A415','Milestone! Your loan dropped below £27,500','2h ago')}
      ${nItem('🔥','#FF8A3D15','6-day streak — keep it going today','5h ago')}
      ${nItem('👨‍👩‍👧','#1A6DFF12','Mum added £2.40 to your loan from her shop','Yesterday')}
      ${nItem('🏆','#F5B23D22','You moved up to #3 on the uni leaderboard','Yesterday')}
      ${nItem('✨','#0FB8A415','Coach found 3 new ways to save £61 this month','2 days ago')}
    </div>
  </div>`;
}
function nItem(ic,bg,t,s){
  return `<div class="nitem2"><div class="ic" style="background:${bg};">${ic}</div><div><div class="t">${t}</div><div class="s">${s}</div></div></div>`;
}
function qrModal(){
  return `<div class="qrmodal" id="qrClose">
    <div class="qrsheet">
      <div style="font-size:15px;font-weight:900;color:var(--navy);">${S.qrOpen}</div>
      <div style="font-size:11.5px;color:var(--dim);font-weight:600;margin-top:3px;">Show this at the till — cashback lands on your loan instantly.</div>
      <div class="qrgrid"></div>
      <div class="pill pos" style="display:inline-block;">Cashback → your loan, automatically</div>
    </div>
  </div>`;
}

/* ============================= RENDER + EVENTS ============================= */
const RENDER = {ob1:rOb1,ob2:rOb2,ob3:rOb3,dashboard:rDashboard,loan:rLoan,offers:rOffers,
  pbsa:rPbsa,community:rCommunity,ai:rAi,settings:rSettings,pdash:rPdash,pgoals:rPgoals,pboard:rPboard};

function render(){
  screenEl.innerHTML = RENDER[S.screen]();
  wire();
  renderSide();
  const ca = screenEl.querySelector('#chatArea');
  if(ca){ const sb=screenEl.querySelector('.sbody'); sb.scrollTop = sb.scrollHeight; }
}
function renderSide(){
  const list = S.role==='student'?studentScreens:parentScreens;
  document.getElementById('stepList').innerHTML = list.map(s=>`
    <div class="step ${S.screen===s.k?'active':''}" data-screen="${s.k}">
      <span class="num">${s.num}</span> ${s.n} ${s.isnew?'<span class="newtag">NEW</span>':''}
    </div>`).join('');
  document.getElementById('sideNote').innerHTML = notes[S.role];
  document.getElementById('roleStudent').classList.toggle('on', S.role==='student');
  document.getElementById('roleParent').classList.toggle('on', S.role==='parent');
  document.querySelectorAll('#stepList .step').forEach(el=>{
    el.onclick=()=>{S.screen=el.dataset.screen; S.notifOpen=false; S.qrOpen=null; render();};
  });
}
document.getElementById('roleStudent').onclick=()=>{S.role='student';S.screen='dashboard';S.notifOpen=false;S.qrOpen=null;render();};
document.getElementById('roleParent').onclick=()=>{S.role='parent';S.screen='pdash';S.notifOpen=false;S.qrOpen=null;render();};

const AI_RESPONSES = {
  save:`Three quick wins I can see 👇<br><br>1️⃣ Your <span class="hl">food spend is £18 over</span> your usual — the Sainsbury's 3% offer covers your top shop.<br>2️⃣ You bought coffee 9× near campus — <span class="hl">Grind pays 10% to your loan</span>, that's ~£4/mo.<br>3️⃣ Your phone contract renews next week — the student partner deal saves <span class="hl">£39/year</span>.<br><br>Total: about <span class="hl">£61 this month</span>.<div class="act" data-nav="offers">Show me these offers</div>`,
  faster:`You're paying off faster than <span class="hl">82% of Manchester students</span> already 💪<br><br>The single biggest lever: your round-ups average £14/mo. If your mum matches them (she's opted in to suggestions), that's <span class="hl">£28/mo → 5 extra months shaved off</span> and ~£400 interest saved.<div class="act" data-ai-act="nudge">Send Mum a gentle nudge</div>`,
  rent:`Yes — you're safe 😊 Rent (£620) is due on the 1st and your balance after committed spending will be <span class="hl">£712</span>.<br><br>One heads-up: I've <span class="hl">paused round-ups for the 3 days before rent</span> like always, so nothing surprises you. They restart on the 2nd automatically.`,
  nudge:`Done ✉️ I've sent Mum a friendly note: <i>"Amara is £16 from her monthly goal — matching her round-ups would get her there!"</i><br><br>No pressure on her side — it's a suggestion, not a request. I'll let you know if she opts in.`,
};

function askAI(key){
  const q = {save:'Where can I save money this month?',faster:'How do I pay my loan off faster?',rent:'Will I be okay for rent this month?',nudge:'Send Mum a gentle nudge'}[key];
  S.chat.push({who:'me',html:q});
  S.aiBusy=true; render();
  setTimeout(()=>{ S.aiBusy=false; S.chat.push({who:'ai',html:AI_RESPONSES[key]}); render(); }, 1100);
}

function wire(){
  screenEl.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click',()=>{S.screen=el.dataset.goto;render();}));
  screenEl.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();S.screen=el.dataset.nav;S.notifOpen=false;S.qrOpen=null;render();}));
  screenEl.querySelectorAll('[data-otab]').forEach(el=>el.addEventListener('click',()=>{S.offersTab=el.dataset.otab;render();}));
  screenEl.querySelectorAll('[data-lbtab]').forEach(el=>el.addEventListener('click',()=>{S.lbTab=el.dataset.lbtab;render();}));
  screenEl.querySelectorAll('[data-qr]').forEach(el=>el.addEventListener('click',()=>{S.qrOpen=el.dataset.qr;render();}));
  screenEl.querySelectorAll('[data-ai]').forEach(el=>el.addEventListener('click',()=>askAI(el.dataset.ai)));
  screenEl.querySelectorAll('[data-ai-act]').forEach(el=>el.addEventListener('click',()=>askAI(el.dataset.aiAct)));
  screenEl.querySelectorAll('[data-chal]').forEach(el=>el.addEventListener('click',()=>{
    const k=el.dataset.chal;
    if(!S.challenges[k]){ S.challenges[k]=true; S.chalProg[k]=k==='c1'?64:8; render(); toast('🏆 Challenge joined!'); }
  }));
  screenEl.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation(); const k=el.dataset.toggle; S[k]=!S[k]; render();
    if(k==='smartOptimise'&&S[k]) toast('✨ AI optimiser on — pauses round-ups before rent');
  }));
  screenEl.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation(); const a=el.dataset.action;
    if(a==='boost'){
      const old=S.balance; S.balance-=25; render();
      const bn=screenEl.querySelector('#balNum'); if(bn) countUp(bn,old,S.balance);
      confetti(); toast('⚡ £25 applied — nice one!');
    }
    if(a==='roundup'){ S.roundUp=!S.roundUp; render(); toast('↻ Round-ups '+(S.roundUp?'on':'off')); }
    if(a==='simulate'){
      const feed=screenEl.querySelector('#feed');
      if(feed){
        const opts=[['🍕','Pizza Co — partner','Just now','+£0.62'],['🚌','Bee Network bus','Just now','+£0.18'],['📚','Blackwell\'s','Just now','+£1.15']];
        const o=opts[Math.floor(Math.random()*opts.length)];
        const d=document.createElement('div');
        d.innerHTML=feedItem(o[0],'#0FB8A415',o[1],'Card-linked · '+o[2],o[3],'to your loan','var(--teal)');
        const item=d.firstElementChild; item.classList.add('new');
        feed.prepend(item);
        const cb=parseFloat(o[3].replace('+£',''));
        S.cashbackMonth+=cb; S.balance=Math.round((S.balance-cb));
        toast('💳 Purchase detected — cashback → loan');
      }
    }
    if(a==='book'){ confetti(); toast('🎯 £240 will hit your loan on move-in'); }
    if(a==='list'){ toast('📸 Listing flow — coming in build'); }
    if(a==='match'){ confetti(); toast('💙 Matching Amara\'s round-ups from today'); }
    if(a==='addgoal'){ S.parentGoal=Math.min(100,S.parentGoal+20); render(); if(S.parentGoal>=100){confetti();toast('🎉 Goal complete — £100 off her loan!');}else{toast('+£20 added to the shared goal');} }
  }));
  const nb=screenEl.querySelector('#notifBtn'); if(nb) nb.addEventListener('click',()=>{S.notifOpen=true;render();});
  const nd=screenEl.querySelector('#ndClose'); if(nd) nd.addEventListener('click',e=>{if(e.target.id==='ndClose'){S.notifOpen=false;render();}});
  const qc=screenEl.querySelector('#qrClose'); if(qc) qc.addEventListener('click',e=>{if(e.target.id==='qrClose'){S.qrOpen=null;render();}});
  const lb=screenEl.querySelector('#linkBtn'); if(lb) lb.addEventListener('click',()=>{
    lb.textContent='Connecting…';
    setTimeout(()=>{ S.screen='dashboard'; render(); confetti(); toast('✅ Card linked — cashback is live'); },900);
  });
  const sl=screenEl.querySelector('#reduceSlider'); if(sl) sl.addEventListener('input',e=>{S.reduceAmt=parseInt(e.target.value);render();});
}

render();

/* ============================= SPLASH SCREEN ============================= */
function showSplash(){
  const sp=document.getElementById('splash');
  sp.style.display='flex';
  sp.classList.remove('hide');
  const bar=sp.querySelector('.splash-bar i');
  bar.style.animation='none'; void bar.offsetWidth; bar.style.animation='';
  const lg=sp.querySelector('.slogo');
  lg.style.animation='none'; void lg.offsetWidth; lg.style.animation='';
  setTimeout(()=>{ sp.classList.add('hide'); setTimeout(()=>{sp.style.display='none';},480); }, 2600);
}
document.getElementById('replaySplash').addEventListener('click', showSplash);
showSplash();
</script>
</body>
</html>
