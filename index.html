<meta charset="UTF-8">
<title>Student Freedom — Admin Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1A2F; --navy2:#0F2440; --panel:#101F36; --line:#1E3252;
  --teal:#0FB8A4; --blue:#3D8BFF; --orange:#FF8A3D; --red:#E45858; --gold:#F5B23D;
  --purple:#8B6FE8;
  --bg:#F4F6FA; --card:#FFFFFF; --cline:#E6EBF2; --ink:#13233C; --dim:#68788F;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;}
::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:#C7D1DE;border-radius:10px;}

/* LAYOUT */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:236px;background:var(--navy);color:#B9C6D8;flex-shrink:0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;}
.logomark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1A6DFF,#0FB8A4);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo .t{font-weight:900;color:#fff;font-size:14px;line-height:1.15;}
.logo .s{font-size:9.5px;font-weight:700;color:#5E7494;letter-spacing:.06em;text-transform:uppercase;}
.envbadge{margin:0 18px 12px;background:rgba(228,88,88,.14);border:1px solid rgba(228,88,88,.4);
  color:#FF9B9B;font-size:10px;font-weight:900;letter-spacing:.06em;padding:5px 10px;border-radius:8px;
  text-align:center;text-transform:uppercase;}
.navgroup{font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#4E6486;
  padding:14px 18px 6px;}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;font-size:13px;
  font-weight:600;color:#8FA2BC;border-left:3px solid transparent;transition:all .12s;}
.navitem:hover{color:#fff;background:rgba(255,255,255,.04);}
.navitem.on{color:#fff;background:linear-gradient(90deg,rgba(26,109,255,.16),transparent);border-left-color:var(--teal);}
.navitem .ic{width:17px;text-align:center;font-size:14px;}
.navitem .cnt{margin-left:auto;background:var(--orange);color:#fff;font-size:9.5px;font-weight:900;
  border-radius:100px;padding:2px 7px;}
.navitem .cnt.red{background:var(--red);}
.adminbox{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;}
.adminav{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#8B6FE8,#3D8BFF);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:12px;}
.adminbox .n{font-size:12px;font-weight:800;color:#fff;}
.adminbox .r{font-size:10px;color:#5E7494;font-weight:700;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:#fff;border-bottom:1px solid var(--cline);padding:12px 26px;display:flex;
  align-items:center;gap:16px;position:sticky;top:0;z-index:30;}
.crumb{font-size:13px;font-weight:800;}
.crumb span{color:var(--dim);font-weight:600;}
.gsearch{flex:1;max-width:420px;position:relative;}
.gsearch input{width:100%;padding:9px 14px 9px 36px;border-radius:10px;border:1.5px solid var(--cline);
  background:var(--bg);font-family:inherit;font-size:12.5px;outline:none;}
.gsearch input:focus{border-color:var(--teal);}
.gsearch .mag{position:absolute;left:12px;top:9px;color:var(--dim);}
.topbtn{background:#fff;border:1.5px solid var(--cline);border-radius:10px;padding:8px 13px;
  font-size:12px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit;display:flex;gap:6px;align-items:center;}
.content{padding:24px 26px 60px;max-width:1280px;width:100%;}

/* GENERIC */
h2.page{font-size:20px;font-weight:900;margin:0 0 4px;}
p.sub{color:var(--dim);font-size:13px;margin:0 0 20px;font-weight:500;}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g2{grid-template-columns:repeat(2,1fr);}
.card{background:var(--card);border:1px solid var(--cline);border-radius:14px;padding:18px;}
.kpi .l{font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;}
.kpi .v{font-size:24px;font-weight:900;margin:6px 0 2px;}
.kpi .d{font-size:11.5px;font-weight:800;}
.pos{color:var(--teal);} .neg{color:var(--red);} .wrn{color:var(--orange);}
.pill{font-size:10px;font-weight:900;padding:3px 9px;border-radius:100px;display:inline-block;letter-spacing:.02em;}
.pill.green{background:rgba(15,184,164,.12);color:#0A9B8A;}
.pill.red{background:rgba(228,88,88,.12);color:var(--red);}
.pill.orange{background:rgba(255,138,61,.14);color:#E0731F;}
.pill.blue{background:rgba(61,139,255,.12);color:#2D6FD6;}
.pill.grey{background:#EEF1F6;color:var(--dim);}
.pill.purple{background:rgba(139,111,232,.13);color:#6F53CE;}
table{width:100%;border-collapse:collapse;}
th{font-size:10.5px;font-weight:900;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;
  text-align:left;padding:10px 12px;border-bottom:1.5px solid var(--cline);}
td{padding:12px;border-bottom:1px solid var(--cline);font-size:12.5px;font-weight:600;vertical-align:middle;}
tr.rowlink{cursor:pointer;transition:background .1s;}
tr.rowlink:hover{background:#F8FAFD;}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#1A6DFF,#0FB8A4);
  color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:10.5px;flex-shrink:0;}
.ucell{display:flex;align-items:center;gap:10px;}
.ucell .nm{font-weight:800;} .ucell .em{font-size:10.5px;color:var(--dim);font-weight:600;}
.btn{border:none;border-radius:10px;padding:9px 14px;font-size:12px;font-weight:800;font-family:inherit;
  cursor:pointer;transition:transform .08s;display:inline-flex;align-items:center;gap:6px;}
.btn:active{transform:scale(.97);}
.btn.teal{background:var(--teal);color:#fff;}
.btn.navy{background:var(--navy);color:#fff;}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--cline);}
.btn.danger{background:rgba(228,88,88,.1);color:var(--red);border:1.5px solid rgba(228,88,88,.3);}
.btn.sm{padding:6px 11px;font-size:11px;border-radius:8px;}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.fchip{background:#fff;border:1.5px solid var(--cline);border-radius:100px;padding:7px 14px;
  font-size:11.5px;font-weight:800;color:var(--dim);cursor:pointer;}
.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff;}
.searchbox{padding:9px 13px;border-radius:10px;border:1.5px solid var(--cline);font-family:inherit;
  font-size:12.5px;outline:none;width:260px;background:#fff;}
.searchbox:focus{border-color:var(--teal);}
.toolrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap;}

/* DRAWER */
.drawer-bg{position:fixed;inset:0;background:rgba(10,26,47,.45);z-index:60;animation:fi .15s;}
@keyframes fi{from{opacity:0;}to{opacity:1;}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:92vw;background:#fff;z-index:61;
  box-shadow:-20px 0 50px -20px rgba(10,26,47,.35);overflow-y:auto;animation:slid .22s ease;}
@keyframes slid{from{transform:translateX(60px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.dhead{padding:20px 24px;border-bottom:1px solid var(--cline);display:flex;align-items:center;gap:14px;
  position:sticky;top:0;background:#fff;z-index:5;}
.dhead .x{margin-left:auto;background:var(--bg);border:none;width:32px;height:32px;border-radius:9px;
  cursor:pointer;font-size:15px;font-weight:900;color:var(--dim);}
.dbody{padding:20px 24px 40px;}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:12.5px;margin-bottom:6px;}
.dl dt{color:var(--dim);font-weight:700;}
.dl dd{margin:0;font-weight:700;}
.sect{font-size:11px;font-weight:900;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
  margin:22px 0 10px;padding-bottom:7px;border-bottom:1.5px solid var(--cline);}
.actgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.timeline{border-left:2px solid var(--cline);margin-left:8px;padding-left:18px;}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item::before{content:"";position:absolute;left:-24px;top:3px;width:10px;height:10px;border-radius:50%;
  background:var(--teal);border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--cline);}
.tl-item.sys::before{background:#B9C6D8;}
.tl-item .t{font-size:12.5px;font-weight:800;}
.tl-item .s{font-size:11px;color:var(--dim);font-weight:600;margin-top:2px;line-height:1.5;}
.notebox{width:100%;border:1.5px solid var(--cline);border-radius:11px;padding:11px 13px;font-family:inherit;
  font-size:12.5px;resize:vertical;min-height:70px;outline:none;}
.notebox:focus{border-color:var(--teal);}

/* AUDIT */
.audit-row{display:flex;gap:13px;background:#fff;border:1px solid var(--cline);border-radius:12px;
  padding:13px 16px;margin-bottom:9px;align-items:flex-start;}
.audit-row.live{animation:pop .4s ease;border-color:rgba(15,184,164,.55);}
@keyframes pop{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.aic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;}
.audit-main{flex:1;min-width:0;}
.audit-t{font-size:12.5px;font-weight:800;}
.audit-s{font-size:11px;color:var(--dim);font-weight:600;margin-top:2px;}
.audit-meta{text-align:right;font-size:10.5px;color:var(--dim);font-weight:700;flex-shrink:0;}
.hash{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;color:#9AA8BC;margin-top:3px;}
.diff{background:#0E1C31;border-radius:10px;padding:10px 13px;margin-top:9px;font-family:ui-monospace,Menlo,monospace;
  font-size:11px;color:#B9C6D8;line-height:1.7;display:none;}
.diff .rm{color:#FF9B9B;} .diff .ad{color:#6FE0C8;}
.audit-row.open .diff{display:block;}

/* INTEGRATIONS */
.intcard{display:flex;gap:14px;align-items:flex-start;}
.intlogo{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;}
.intcard .nm{font-size:13.5px;font-weight:900;}
.intcard .ds{font-size:11.5px;color:var(--dim);font-weight:600;margin-top:2px;line-height:1.5;}
.krow{display:flex;align-items:center;gap:8px;margin-top:10px;font-family:ui-monospace,Menlo,monospace;
  font-size:11px;background:var(--bg);border:1px solid var(--cline);border-radius:8px;padding:7px 10px;color:var(--dim);}
.krow button{margin-left:auto;}
.hbar{display:flex;gap:3px;margin-top:10px;}
.hbar span{flex:1;height:18px;border-radius:4px;background:rgba(15,184,164,.7);}
.hbar span.w{background:rgba(255,138,61,.75);} .hbar span.e{background:rgba(228,88,88,.8);}
.switch{width:40px;height:23px;border-radius:100px;background:#D7DEE8;position:relative;cursor:pointer;
  flex-shrink:0;transition:background .2s;}
.switch.on{background:var(--teal);}
.switch .knob{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s;}
.switch.on .knob{left:20px;}

/* RBAC */
.rbac{overflow-x:auto;}
.rbac td:first-child{font-weight:800;}
.perm{width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;}
.perm.y{background:rgba(15,184,164,.15);color:#0A9B8A;}
.perm.n{background:#EEF1F6;color:#B7C1CF;}
.perm.a{background:rgba(255,138,61,.15);color:#E0731F;}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:13px 20px;
  border-radius:12px;font-size:12.5px;font-weight:800;box-shadow:0 16px 40px -12px rgba(0,0,0,.4);
  opacity:0;transform:translateY(12px);transition:all .25s;z-index:99;display:flex;gap:9px;align-items:center;}
.toast.show{opacity:1;transform:translateY(0);}
.sla{font-size:10.5px;font-weight:900;}
.sla.ok{color:#0A9B8A;} .sla.risk{color:#E0731F;} .sla.breach{color:var(--red);}
.riskbar{width:74px;height:7px;border-radius:10px;background:#EEF1F6;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:7px;}
.riskbar i{display:block;height:100%;border-radius:10px;}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;}
.empty{padding:34px;text-align:center;color:var(--dim);font-weight:700;font-size:12.5px;}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:1fr 1fr;}}
</style>
</head>

function unlock(uid){
  const u=USERS.find(x=>x.id===uid);u.status='Active';
  toast('🔓 Account unlocked — customer notified');
  audit('🔓','rgba(15,184,164,.1)','Account unlocked — '+u.name+' ('+uid+')','identity verified via CC-4820','<span class="rm">- status: "Locked"</span><br><span class="ad">+ status: "Active"</span>');
  render();
}
function suspend(uid){
  const u=USERS.find(x=>x.id===uid);u.status='Suspended';
  toast('⛔ Account suspended — reason logged');
  audit('⛔','rgba(228,88,88,.1)','Account suspended — '+u.name+' ('+uid+')','manual action · reason code required and captured','<span class="rm">- status: "Active"</span><br><span class="ad">+ status: "Suspended"</span>');
  render();
}
function resolveTicket(id,ic,label,diff){
  const t=TICKETS.find(x=>x.id===id);t.status='Resolved';t.sla='Met';t.slac='ok';
  t.tl.push({t:label,s:'Just now · By: Ruben Iversen · CSAT survey sent',sys:0});
  toast('✅ '+id+' resolved');
  audit(ic,'rgba(15,184,164,.1)',label+' — ticket '+id,'ticket resolved · customer notified','<span class="ad">'+diff+'</span>');
  render();
}
function submitEvidence(id){
  const c=CHARGEBACKS.find(x=>x.id===id);c.status='Submitted';c.due='—';c.stage='With issuer · decision pending';
  toast('📤 Evidence pack submitted via VROL');
  audit('↩️','rgba(255,138,61,.12)','Chargeback evidence submitted — '+id+' ('+c.merchant+', '+c.amt+')','auto-pack: receipt, device match, geo, delivery proof','<span class="ad">+ representment: submitted to Visa Resolve Online</span>');
  render();
}
function triageCb(id){
  const c=CHARGEBACKS.find(x=>x.id===id);c.status='Evidence required';c.stage='Representment window open';
  toast('🗂 '+id+' triaged — evidence checklist created');
  audit('↩️','rgba(255,138,61,.12)','Chargeback triaged — '+id,'cashback '+c.cb+' moved to held state (auto-clawback rule)','<span class="ad">+ cashback_hold: '+c.cb+'</span>');
  render();
}

/* ================= RENDER ================= */
const PAGES={overview:pOverview,users:pUsers,tickets:pTickets,chargebacks:pChargebacks,integrations:pIntegrations,payouts:pPayouts,partners:pPartners,fraud:pFraud,compliance:pCompliance,audit:pAudit,rbac:pRbac,health:pHealth};
function render(){
  renderNav();
  document.getElementById('crumb').innerHTML=`Admin <span>/ ${TITLES[V.page]}</span>`;
  document.getElementById('content').innerHTML=PAGES[V.page]();
  document.getElementById('overlay').innerHTML=drawerHtml();
}
document.getElementById('gsearchInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){V.page='users';V.userQ=e.target.value;V.userFilter='all';render();}
});
render();
</script>
